name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Steam specials (50 rows, Indonesia)
        run: |
          curl -sS -A "steam-deals-bot/0.1 (student project)" -o steam_search_id.json -w "http=%{http_code}\n" "https://store.steampowered.com/search/results/?query&start=0&count=50&specials=1&infinite=1&cc=id"
          head -c 300 steam_search_id.json
      - uses: actions/upload-artifact@v4
        with:
          name: steam-probe
          path: steam_search_id.json
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode text="Uji coba steam-deals-bot: workflow berjalan."
